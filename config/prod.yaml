# Environment config. Selected by --env (so --env prod loads this file and also
# supplies the {env} segment of the S3 path). Nothing here is secret: the DB
# password lives in Secrets Manager and secret_name is only a lookup key.
#


aws:
  region: us-east-1
  secret_name: GlobalPartnersDBLogin
  bucket: globalpartners-project-cjk

# Which Iceberg catalog backend the jobs configure.
#
#   glue    AWS Glue Data Catalog, warehouse on S3. Spark AND PyIceberg both
#           read it, which is what lets the Streamlit app query the pipeline's
#           own tables under the same identifiers -- iceberg.gold.<table> here,
#           gold.<table> there. Namespaces become Glue databases, created on
#           first write, so nothing is provisioned by hand.
#   hadoop  A directory catalog, warehouse anywhere. No AWS and nothing to
#           create, but Spark-only: PyIceberg cannot read it, so the dashboard
#           would not see these tables.

catalog:
  type: glue
  warehouse: s3://globalpartners-project-cjk/prod/warehouse

database:
  name: GlobalPartners

layers:
  raw: raw
  silver: silver
  gold: gold
  quarantine: quarantine

tables:
  date_dim:
    source_table: dbo.date_dim
    load_type: static
    business_keys: [date_key]
    required_columns:
      date_key: date
      year: smallint
      month: smallint
      week: smallint
      day_of_week: string
      is_weekend: boolean
      is_holiday: boolean
      holiday_name: string
    silver_write: replace

  order_items:
    source_table: dbo.order_items
    load_type: incremental
    business_keys: [ORDER_ID, LINEITEM_ID]
    required_columns:
      ORDER_ID: string
      LINEITEM_ID: string
      RESTAURANT_ID: string
      CREATION_TIME_UTC: string
      ITEM_PRICE: double
      ITEM_QUANTITY: int
      APP_NAME: string
      USER_ID: string
      CURRENCY: string
      ITEM_NAME: string
      ITEM_CATEGORY: string
      INSERTED_AT: timestamp
      IS_LOYALTY: boolean
    silver_transforms:
      creation_time_utc: timestamp
      item_price: decimal(10,2)
    silver_cleaners:
      item_category:        
        - ['https?://[^#]*#', '']
        - ['^Bowls0$', 'Bowls']
        - ['^Sandwiches`1$', 'Sandwiches']
        - ['^Sqalads$', 'Salads']
        - ["^Kids$", "Kid's"]
    # Rows silver does not carry at all. silver_cleaners above repairs a value;
    # this drops the row. The one entry is the `Alltown Fresh - DEVELOPMENT`
    # app: a test deployment writing to the same source tables, measured at 826
    # lines / 741 orders / $7,221.54 / 115 users, all on the single restaurant
    # 6050e76361e498ca740bba6f, which carries no other traffic.
    #
    # Filtered rather than flagged because the cut is a clean partition -- no
    # order mixes dev and non-dev lines and none of those 115 users ever
    # ordered on a real store -- so no surviving customer's lifetime, cadence
    # or segment is recomputed from a truncated history.
    silver_filters:
      app_name: ['(?i)DEVELOPMENT']
    watermark_column: inserted_at
    silver_write: merge
    # months, not days: at ~150 rows per day, days() produced 1336 partitions
    # holding 11 KB each. 
    silver_partition_by: ["months(creation_time_utc)"]

  order_item_options:
    source_table: dbo.order_item_options
    load_type: incremental
    business_keys: [ORDER_ID, LINEITEM_ID, OPTION_GROUP_NAME, OPTION_NAME]
    required_columns:
      ORDER_ID: string
      LINEITEM_ID: string
      OPTION_GROUP_NAME: string
      OPTION_NAME: string
      OPTION_PRICE: double
      OPTION_QUANTITY: smallint
    silver_transforms:
      option_price: decimal(10, 2)    
    watermark_column: inserted_at
    silver_write: delete_insert
    silver_scope_keys: [ORDER_ID]


# Derived tables built from silver. Each name must match a transform registered
# in python_scripts/silver_to_gold/transforms/.
#
# event_time_column drives the incremental read: a run finds which event dates
# this batch touched, recomputes those dates completely from all of silver, and
# replaces them. 
gold:
  daily_restaurant_sales:
    depends_on: [order_items]
    event_time_column: creation_time_utc
    grain_keys: [sales_date, restaurant_id]
    scope_keys: [sales_date]
    write: delete_insert
    partition_by: ["months(sales_date)"]
    output_columns:
      sales_date: date
      restaurant_id: string
      total_orders: bigint
      total_revenue: decimal(18,2)
      avg_order_total: decimal(10,2)
      week_start: date


  # Full rebuild every run, which is cheap at one row per customer
  # With the current volume.

  customer_lifetime_value:
    depends_on: [order_items]
    grain_keys: [user_id]
    write: replace
    output_columns:
      user_id: string
      total_lifetime_revenue: decimal(18,2)
      total_orders: bigint
      clv_segment: string
      avg_order_value: decimal(10,2)
      is_volume_outlier: boolean
      orders_per_active_day: decimal(10,4)

  # The 90-day activity window is measured from the order_items data,
  # not from batch_date.
  customer_rfm:
    depends_on: [order_items]
    grain_keys: [user_id]
    write: replace
    output_columns:
      user_id: string
      segment: string
      segment_group: string
      orders_last90d: bigint
      spend_last90d: decimal(18,2)
      vip_spend_cut: decimal(18,2)
      anchor_date: date

  # Weekly, monthly and seasonal grains in one table, told apart by
  # period_type, because weeks do not nest inside months: 39 of 201 weeks here
  # straddle a month boundary, so monthly rows cannot be summed from weekly
  # ones. Full rebuild -- a batch holding part of a week would publish a
  # partial weekly row. Unpartitioned: ~10k rows at this volume.
  category_period_sales:
    depends_on: [order_items, date_dim]
    grain_keys: [period_type, period_start, item_category]
    write: replace
    output_columns:
      period_type: string
      period_start: date
      period_end: date
      item_category: string
      season: string
      season_year: int
      total_orders: bigint
      total_order_items: bigint
      total_sales: decimal(18,2)
      avg_sales_per_order: decimal(18,2)
      avg_order_items: decimal(10,2)
      avg_revenue_per_day: decimal(18,2)
      avg_orders_per_week: decimal(10,2)
      avg_orders_per_month: decimal(10,2)
      period_days: int
      days_with_sales: int
      holiday_days: int
      weekend_days: int
      is_holiday_week: boolean
      pct_of_total_sales: decimal(7,4)
      is_material: boolean


  # Order profile by loyalty membership state, five rows that DELIBERATELY
  # OVERLAP: a switcher's flagged order is counted in three of them. They are
  # five separate answers, not a partition, so summing total_revenue over this
  # table reports several times the business. Full rebuild -- a slice holding
  # only a customer's flagged orders would file a switcher as a member
  # throughout. Five rows, so unpartitioned.
  #
  # "All members" against "Never members" is a LEVEL difference and is
  # confounded by who chooses to enrol. "Observed in both states", Pre-member
  # against Member, is a CHANGE within the same customers and is not. Carrying
  # both is what lets the two be told apart.

  loyalty_order_profile:
    depends_on: [order_items]
    grain_keys: [population, membership_state]
    write: replace
    output_columns:
      population: string
      membership_state: string
      customers: bigint
      orders: bigint
      total_revenue: decimal(18,2)
      avg_order_value: decimal(10,2)
      # Beside the mean because one large order moves a mean; the two
      # disagreeing is a finding, not noise.
      median_order_value: decimal(10,2)
      # Both readings of "number of items", because they move independently:
      # a two-for-one offer raises units without touching line items.
      avg_line_items_per_order: decimal(10,2)
      avg_units_per_order: decimal(10,2)

  # The business before and after the loyalty program, on EQUAL windows: the
  # post era runs from the first flagged order to the last order in the data,
  # and the pre era is the same number of days ending the day before. The
  # transform derives both from order_items, so a later batch moves them
  # together instead of leaving a hardcoded date behind.
  #
  # Equal lengths are not a nicety. Measured naively -- all history before
  # 2023 against everything after -- orders per customer reads 5.47 against
  # 4.69 and the program looks harmful. The windows were 1,070 days against
  # 330, and orders per customer accumulates with observation time. On equal
  # windows the same measure reads 4.29 against 4.69 and the sign flips.
  #
  #
  # Full rebuild. There is no event_time_column because a slice of a batch
  # cannot say which era it belongs to without seeing where the program
  # started, and `replace` so a segment nobody occupies any more cannot keep a
  # stale row. 18 rows, so unpartitioned.
  # Order rate in 30-day periods around each customer's OWN enrollment date,
  # which is the only framing in which "did they order more often" is
  # answerable. loyalty_order_profile splits a switcher's orders by FLAG, and
  # the unflagged side spans years against months for the flagged side, so
  # orders-per-customer falls after joining for reasons that are purely window
  # length -- 13.24 against 7.42, the program looking harmful on an artifact.
  #
  # Period 0 is the JOIN DAY ALONE, one day wide, because the join date is by
  # definition a day the customer ordered. Folding it into the first post
  # period would hand that side a guaranteed order and manufacture a lift.
  # window_days carries 1 there and 30 elsewhere.
  #
  # coverage_days is the half-width the data must actually cover either side
  # of a join date, published at both 90 and 180. The populations OVERLAP --
  # the 180 cohort is a subset of the 90 cohort -- so summing across
  # coverage_days double-counts. Both ship because the trade is real: 180
  # reaches far enough to show whether a lift persists but admits only early
  # joiners; 90 keeps more customers and stops while the effect is still
  # elevated. customers is constant within a coverage_days population.
  #
  # Additive across periods within one coverage_days (orders, total_revenue,
  # line_items, units, active_days), so a +/-90 reading is periods -3..-1 and
  # 1..3 summed, on a cohort held constant. median_order_value is not.
  #
  # Full rebuild: a period index is relative to each customer's join date, so
  # an incremental slice cannot know which period an order belongs to without
  # seeing that customer's whole history. 20 rows, so unpartitioned.
  loyalty_join_profile:
    depends_on: [order_items]
    grain_keys: [coverage_days, period_index]
    write: replace
    output_columns:
      coverage_days: int
      period_index: int
      period_start_day: int
      period_end_day: int
      window_days: int
      customers: bigint
      orders: bigint
      line_items: bigint
      units: bigint
      total_revenue: decimal(18,2)
      # The flagged volume accounts' PORTION of each additive measure, so the
      # excluded reading is `measure - outlier_measure` at any rollup and the
      # dashboard's toggle works on this table rather than skipping it. Not a
      # rounding error here: two accounts place 94, 93, 88, 76 and 64 orders
      # on single days in Jan-Feb 2023, and in period -2 the twenty heaviest
      # customer-days are 30.2% of that period's orders. Who is flagged comes
      # from clv_history, so the floor lives in one place.
      #
      # customers and active_days subtract cleanly too -- a customer-day
      # belongs to exactly one customer. avg_order_value does NOT: recompute
      # it as (total_revenue - outlier_revenue) / (orders - outlier_orders).
      # median_order_value cannot be netted at all.
      outlier_customers: bigint
      outlier_orders: bigint
      outlier_line_items: bigint
      outlier_units: bigint
      outlier_revenue: decimal(18,2)
      outlier_active_days: bigint
      # Distinct customer-days, which is what separates "comes back more
      # often" from "orders more per visit". The two move independently and
      # on this data they move in opposite directions.
      active_days: bigint
      orders_per_customer: decimal(10,4)
      # The only measure comparable across every row, the one-day join
      # period included.
      orders_per_customer_per_day: decimal(12,6)
      active_days_per_customer: decimal(10,4)
      # Null, not zero, on a period with no orders: no visits to average
      # over is not the same as one order per visit.
      orders_per_active_day: decimal(10,4)
      avg_order_value: decimal(10,2)
      median_order_value: decimal(10,2)


  # Where each segment's customers ended up 180 days later, as a share of each
  # origin row -- so row_pct sums to 100 across every (era, seg_t0).
  # Full rebuild, no event_time_column: a slice of one batch cannot say what a
  # customer looked like 180 days before it. At most 9 x 7 x 3 rows, so
  # unpartitioned, and `replace` so an origin nobody occupies any more cannot
  # keep a stale row.
  customer_segment_transitions:
    depends_on: [order_items]
    grain_keys: [era, seg_t0, grp_t1]
    write: replace
    output_columns:
      era: string
      # Origin is the SEGMENT and destination is the GROUP: nine destinations
      # per row is a matrix nobody reads, but the origin has to tell Slipping
      # from Lapsing or the table answers nothing.
      seg_t0: string
      grp_t1: string
      t0: date
      t1: date
      transition_days: int
      customers: bigint
      # The row denominator, published so row_pct can be checked rather than
      # trusted.
      customers_at_t0: bigint
      row_pct: decimal(5,2)
      vip_spend_cut: decimal(18,2)

  # Members against non-members over the SAME 180 days, which is the point:
  # holding the calendar fixed keeps the chain's growth and the January-2023
  # reprice out of the comparison. Two tables, two confounds, read together --
  #   loyalty_order_profile  within-customer split, calendar floats
  #   this table             membership split, calendar fixed, mix floats
  # A third, loyalty_era_profile, split on calendar instead and carried both
  # confounds at once; it was removed rather than caveated.
  #
  
  loyalty_cohort_outcomes:
    depends_on: [order_items]
    grain_keys: [cohort, seg_t0]
    write: replace
    output_columns:
      cohort: string
      seg_t0: string
      t0: date
      t1: date
      transition_days: int
      customers: bigint
      # Complements by construction -- a T1 group is Dormant or it is not.
      # Both published so neither question needs arithmetic.
      still_active_pct: decimal(5,2)
      to_dormant_pct: decimal(5,2)
      to_core_pct: decimal(5,2)
      avg_orders_90d_t1: decimal(10,2)
      avg_spend_90d_t1: decimal(10,2)
      vip_spend_cut: decimal(18,2)

  # Lifetime spend cut into fifths: Top (top 20%), Mid, Bottom (bottom 20%). The
  # cut itself lives in transforms/clv_history.py, shared with
  # customer_lifetime_value and clv_tier_segments, because a gold transform
  # cannot read another gold table and three copies of a threshold drift.
  #

  clv_tier_profile:
    depends_on: [order_items]
    grain_keys: [clv_tier, outliers]
    write: replace
    output_columns:
      clv_tier: string
      # 'included' (every customer) or 'excluded' (without the three volume
      # accounts). SIX rows, not three: the tiers partition the base only
      # within one population, so a reader who groups by clv_tier alone and
      # forgets this column double-counts. Pin it to one value first.
      outliers: string
      volume_outliers: bigint
      customers: bigint
      pct_of_customers: decimal(5,2)
      total_spend: decimal(18,2)
      pct_of_spend: decimal(5,2)
      median_total_spend: decimal(18,2)
      avg_total_spend: decimal(18,2)
      spend_floor: decimal(18,2)
      spend_ceiling: decimal(18,2)
      total_orders: bigint
      avg_orders: decimal(10,2)
      median_orders: bigint
      avg_spend_per_order: decimal(10,2)
      median_spend_per_order: decimal(10,2)
      one_order_pct: decimal(5,2)
      median_tenure_days: int
      median_recency_days: int
      anchor_date: date

  # The lifetime tier crossed against the 90-day RFM segment, twice over for
  # the two outlier populations: 54 cells at most, and the only table that
  # puts a lifetime measure beside a recent one. 2,367 Top-tier customers are
  # currently Dormant holding 49.1% of all Top-tier lifetime spend, which is
  # the finding this table exists to make visible.
  # A Top-tier customer sitting in Dormant is past value with no present
  # activity, which no single-window table can show.
  #
  # Dormant is INCLUDED here, unlike every other 90-day table, because
  # lifetime spend does not go to zero when activity does -- that cell is the
  # point of the table.
  #
  # Two percentages on purpose. pct_of_tier sums to 100 within a clv_tier
  # (what the Top tier is made of); pct_of_segment sums to 100 within a
  # segment (what share of VIPs have reached Top). Publishing one invites the
  # other to be misread off it.
  #
  # vip_spend_cut is the LIVE cut at the anchor, matching customer_rfm, not
  # the frozen bar the era tables share: this table compares nothing across
  # time. Full rebuild, no event_time_column, unpartitioned.
  clv_tier_segments:
    depends_on: [order_items]
    grain_keys: [clv_tier, segment, outliers]
    write: replace
    output_columns:
      clv_tier: string
      segment: string
      # See clv_tier_profile. Each percentage is of its OWN population, so
      # pct_of_tier sums to 100 within a (clv_tier, outliers) pair.
      outliers: string
      volume_outliers: bigint
      segment_group: string
      customers: bigint
      pct_of_tier: decimal(5,2)
      pct_of_segment: decimal(5,2)
      total_spend: decimal(18,2)
      pct_of_tier_spend: decimal(5,2)
      median_total_spend: decimal(18,2)
      avg_orders: decimal(10,2)
      median_orders: bigint
      avg_customer_order_value: decimal(10,2)
      vip_spend_cut: decimal(18,2)
      anchor_date: date

  # The only gold table with a clock on it, and the one the sales-trend view
  # reads. Grain is (sales_date_local, restaurant_id, item_category,
  # hour_local): 126,440 rows, fewer than silver.order_items, because a line
  # item is the only thing finer than this cell.
  #
  # TIME IS LOCAL (America/New_York) HERE AND UTC EVERYWHERE ELSE. That is
  # deliberate -- an hour-of-day column in UTC puts the 11am revenue peak at
  # 4pm -- and it is why the date column is named sales_date_local rather than
  # sales_date. It will NOT tie exactly to daily_restaurant_sales: $22,009.75,
  # 1.24% of revenue, falls on a different calendar day in the two tables, so
  # sales_date_utc is published as the bridge between them.
  #
  # Every measure here is additive. `orders` is NOT a distinct count per cell,
  # which would double-count an order across its categories; each order is
  # pinned to the cell of its largest line item, so summing any set of rows
  # returns a true order count. The transform docstring has the reasoning.
  #
  # Honours the dashboard's volume-outlier toggle through the outlier_*
  # columns below, so the sales-trend tab is not an exception to it. Who is
  # flagged comes from clv_history, recomputed from silver, so the floor lives
  # in one place for all four tables that use it.
  #
  # No event_time_column on purpose: the grain is the LOCAL date, so a
  # UTC-dated incremental scope would replace the wrong rows either side of
  # midnight. Full rebuild, partitioned by local month for range scans.
  sales_trend_grid:
    depends_on: [order_items, date_dim]
    grain_keys: [sales_date_local, restaurant_id, item_category, hour_local]
    write: replace
    partition_by: ["months(sales_date_local)"]
    output_columns:
      sales_date_local: date
      restaurant_id: string
      item_category: string
      hour_local: int
      daypart: string
      day_of_week: string
      dow_number: int
      is_weekend: boolean
      is_holiday: boolean
      holiday_name: string
      week_start: date
      month_start: date
      sales_date_utc: date
      orders: bigint
      line_items: bigint
      units: bigint
      total_revenue: decimal(18,2)
      # Each cell's flagged-account portion, so excluding the three volume
      # accounts is `measure - outlier_measure` at any rollup. Four columns
      # rather than a second set of rows, which only works because every
      # measure here is additive -- the CLV tables need the grain-key version
      # because a published median cannot be un-aggregated.
      outlier_orders: bigint
      outlier_line_items: bigint
      outlier_units: bigint
      outlier_revenue: decimal(18,2)
