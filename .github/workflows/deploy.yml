# Build and publish the Glue artifacts.
#
# Runs on merges to main. The `production` GitHub environment is the real gate:
# its deployment-branch rule restricts which refs may deploy, and the AWS trust
# policy only accepts the token when the job declares that environment. 
#

# Jobs are created by hand once and from then on UPDATED by CI -- see
# infra/README.md for why. The gp_daily workflow and its triggers are different:
# they carry no uncertain parameters, so CI creates them as well as updates
# them, and a fresh account is bootstrapped by the first push.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: globalpartners-project-cjk
  # Java 17 and Python 3.13 match the Glue 6.0 runtime the pins target.
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Spark 4.x needs Java 17+. Without this the suite dies in the JVM with
      # an UnsupportedClassVersionError rather than a test failure.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Ivy resolves the Iceberg and JDBC jars on the first Spark session.
      # Uncached that is a couple of minutes on every run. Keyed on the file
      # that pins them, so a version bump invalidates it.
      - name: Cache Ivy jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('python_scripts/spark/spark_session.py') }}
          restore-keys: ivy-${{ runner.os }}-

      - run: pip install -e ".[local,dev]"

      # Cheap, and it fails in seconds rather than halfway through a deploy:
      # catches a leaked account id or a field update-job would reject.
      - name: Validate the Glue job and workflow definitions
        run: |
          set -euo pipefail
          # infra/glue/*.json is one file per JOB; the orchestration lives a
          # level down, because both this loop and the deploy step take the
          # job name from the filename.
          for f in infra/glue/*.json; do
            python infra/glue/prepare_job_update.py check "$f"
          done
          for f in infra/glue/workflows/*.json; do
            python infra/glue/prepare_workflow.py check "$f" --job-dir infra/glue
          done

      - name: pytest
        env:
          # conftest sets this itself, so this is belt and braces: config now
          # selects a glue catalog, and a suite that reached AWS would be slow,
          # need credentials, and write to a real account.
          ICEBERG_CATALOG_TYPE: hadoop
        run: pytest -q

  publish:
    name: build and upload
    needs: test
    runs-on: ubuntu-latest
    # Required, not cosmetic: declaring it makes the OIDC token's `sub` read
    # repo:<owner>/<repo>:environment:production, which is exactly what the
    # trust policy pins. Without it the sub is the ref form and AWS denies the
    # assume-role with no indication why.
    environment: production
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for AWS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install build

      # packages.find includes only python_scripts*, so config/ and glue_jobs/
      # are deliberately NOT in the wheel. They upload separately below.
      - name: Build the wheel
        run: python -m build --wheel
     

      # OIDC federation, not a stored access key: nothing long-lived lives in
      # GitHub Secrets. The role's trust policy is in
      # infra/iam/github-actions-deploy-role.json and must name this repo.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts
        run: |
          set -euo pipefail
          PREFIX="s3://${S3_BUCKET}/artifacts/${GITHUB_SHA}"

          # The wheel -- installed by --additional-python-modules.
          aws s3 cp dist/ "${PREFIX}/" --recursive --exclude "*" --include "*.whl"

          # Entry scripts -- one is the ScriptLocation of each Glue job.
          aws s3 cp glue_jobs/ "${PREFIX}/glue_jobs/" --recursive --include "*.py"

          # Config -- delivered by --extra-files, which flattens to the job's
          # working directory, which is why the jobs pass --config-dir '.'
          aws s3 cp config/ "${PREFIX}/config/" --recursive --include "*.yaml"

          echo "ARTIFACT_PREFIX=${PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          aws s3 ls "${PREFIX}/" --recursive --human-readable

      # Must follow the upload: until the artifacts exist at this prefix, a
      # repointed job would reference a wheel that is not there yet.
      #
      # The job name comes from the filename, so capturing a new job with
      # infra/glue/capture_jobs.sh is all it takes for CI to manage it.
      #
      # NOTE this makes the repo authoritative. A change made in the Glue
      # console and not captured back is reverted on the next push to main.
      - name: Point the Glue jobs at this build
        run: |
          set -euo pipefail
          PREFIX="s3://${S3_BUCKET}/artifacts/${GITHUB_SHA}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          for f in infra/glue/*.json; do
            job="$(basename "$f" .json)"
            python infra/glue/prepare_job_update.py deploy "$f"               --prefix "$PREFIX" --account-id "$ACCOUNT_ID" > /tmp/job-update.json
            aws glue update-job --job-name "$job"               --job-update file:///tmp/job-update.json >/dev/null
            echo "  $job -> $PREFIX"
          done

      # After the jobs, because a trigger's actions name them -- and a trigger
      # created against a job that is mid-repoint would fire at the old build.
      #
      # Create-or-update rather than update: a workflow has no parameters to
      # get wrong, so there is no manual-first argument for it, and a fresh
      # account should come up from a push alone.
      #
      # The two calls take DIFFERENT shapes. TriggerUpdate cannot carry Type
      # or WorkflowName, because Glue will not let a trigger change either, so
      # prepare_workflow.py emits one document for create and another for
      # update rather than one document for both.
      #
      # Nothing here arms the clock. CI has no glue:StartTrigger, so a push can
      # change WHAT the schedule does but never WHETHER it runs:
      #   aws glue start-trigger --name gp_daily_start
      - name: Sync the Glue workflow and its triggers
        run: |
          set -euo pipefail

          for wf in infra/glue/workflows/*.json; do
            python infra/glue/prepare_workflow.py emit "$wf"               --kind workflow > /tmp/workflow.json
            name="$(python -c "import json;print(json.load(open('/tmp/workflow.json'))['Name'])")"

            if aws glue get-workflow --name "$name" >/dev/null 2>&1; then
              aws glue update-workflow --cli-input-json file:///tmp/workflow.json >/dev/null
              echo "  workflow $name updated"
            else
              aws glue create-workflow --cli-input-json file:///tmp/workflow.json >/dev/null
              echo "  workflow $name created"
            fi

            # Trigger names cannot contain spaces, so word splitting is safe
            # and a for loop keeps set -e meaningful -- a `while read` down a
            # pipe runs in a subshell and swallows the failure.
            for trigger in $(python infra/glue/prepare_workflow.py names "$wf"); do
              if aws glue get-trigger --name "$trigger" >/dev/null 2>&1; then
                op=update
              else
                op=create
              fi
              python infra/glue/prepare_workflow.py emit "$wf"                 --kind trigger --name "$trigger" --op "$op" > /tmp/trigger.json
              aws glue "${op}-trigger" --cli-input-json file:///tmp/trigger.json >/dev/null
              echo "  trigger  $trigger ${op}d"
            done
          done

          {
            echo "### Glue orchestration"
            echo "Workflow and triggers synced from infra/glue/workflows/."
            echo "The schedule is armed or disarmed by hand, never by a push:"
            echo '```'
            echo "aws glue get-trigger --name gp_daily_start --query Trigger.State"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What to point a Glue job at
        run: |
          {
            echo "### Glue job parameters for this build"
            echo '```'
            echo "ScriptLocation            s3://${S3_BUCKET}/artifacts/${GITHUB_SHA}/glue_jobs/<job>.py"
            echo "--additional-python-modules s3://${S3_BUCKET}/artifacts/${GITHUB_SHA}/globalpartners_pipeline-0.1.0-py3-none-any.whl"
            echo "--extra-files             s3://${S3_BUCKET}/artifacts/${GITHUB_SHA}/config/local.yaml"
            echo "--config-dir              ."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
