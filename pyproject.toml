[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalpartners-pipeline"
version = "0.1.0"
description = "Medallion pipeline: RDS SQL Server to S3 via Spark, local and AWS Glue"
readme = "Readme.md"

# Glue 6.0 runs Python 3.13, matching local development. Kept permissive so the
# wheel still installs on older Glue versions (5.1/5.0 run Python 3.11) if we need
# to fall back.
requires-python = ">=3.9"

# Intentionally empty. AWS Glue already provides pyspark and boto3; declaring
# them here would make Glue's wheel install try to replace its own runtime.
dependencies = []

[project.optional-dependencies]
# Local development only -- never installed on Glue.
# pyspark is pinned to the exact version in the Glue 6.0 runtime so local runs
# and Glue runs exercise the same Spark. Glue 6.0 = Spark 4.1.1 / Hadoop 3.4.2 /
# Scala 2.13.17 / Python 3.13 / Java 17 / Iceberg 1.11.0, AWS SDK for Java v2 only.
# Bump this, hadoop-aws, and the s3a credentials provider together.
local = [
    "pyspark==4.1.1",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    # Glue 6.0 bundles PyYAML, so this stays in the local extra only.
    "pyyaml>=6.0",
]

# Test-only. Separate from `local` so a dev can install the runtime without the
# test tooling, and so nothing test-related can drift into the Glue wheel.
dev = [
    "pytest>=8.0",
]

# The Streamlit dashboard. pyiceberg rather than Spark on purpose: it is pure
# Python, so the app needs no JVM and runs on a small EC2 instance. It reads the
# Glue catalog the pipeline writes, which is why `catalog: type: glue` matters --
# pyiceberg has no hadoop catalog implementation and cannot see those tables.
# The [glue] extra pulls boto3; [pyarrow] is the scan-to-pandas path.
app = [
    "streamlit>=1.40",
    "pyiceberg[glue,pyarrow]>=0.8",
    "pandas>=2.2",
]

# Notebook review tooling. pyarrow reads S3 through its own bundled AWS SDK, so
# this deliberately avoids s3fs -- that pulls in aiobotocore, which pins botocore
# to a narrow range and fights the installed boto3.
review = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "ipykernel>=6.29",
]

# Only the pipeline package ships in the wheel; Data/, infra/ and config/ stay out.
[tool.setuptools.packages.find]
include = ["python_scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests.conftest import ...` resolves.
# `python -m pytest` prepends the working directory and the bare `pytest`
# console script does not, so without this the suite passes locally and fails
# in CI, which is exactly what happened.
pythonpath = ["."]
markers = [
    "spark: needs a real Spark session (slow -- JVM start plus jar resolution)",
]
