[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalpartners-pipeline"
version = "0.1.0"
description = "Medallion pipeline: RDS SQL Server to S3 via Spark, local and AWS Glue"
readme = "Readme.md"

# Glue 5.0 runs Python 3.11 and Glue 4.0 runs 3.10. Keep this permissive so the
# wheel installs on Glue even though local development is on 3.13.
requires-python = ">=3.9"

# Intentionally empty. AWS Glue already provides pyspark and boto3; declaring
# them here would make Glue's wheel install try to replace its own runtime.
dependencies = []

[project.optional-dependencies]
# Local development only -- never installed on Glue.
# pyspark is pinned to the exact version in the Glue 5.0 runtime so local runs
# and Glue runs exercise the same Spark. Bump both together when changing Glue version.
local = [
    "pyspark==3.5.4",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

# Only the pipeline package ships in the wheel; Data/, infra/ and config/ stay out.
[tool.setuptools.packages.find]
include = ["python_scripts*"]
